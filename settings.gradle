pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'llmera'
include 'llmera-ae2'
include 'llmera-mekanism'
include 'llmera-create'

// Pull LLM API in as a composite-build sibling. Its own build.gradle is the
// source of truth; we just need it on the classpath here. The path is read
// from gradle.properties so it can be moved without editing this file.
includeBuild(llmapi_path) {
    dependencySubstitution {
        substitute module('com.example.llmapi:llmapi') using project(':')
    }
}
